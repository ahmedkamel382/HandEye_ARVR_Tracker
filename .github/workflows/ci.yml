name: HandEye Tracker CI/CD Pipeline

on:
  push:
    branches: [ "master", "first-full-working-demo" ]
  pull_request:
    branches: [ "master", "first-full-working-demo" ]

jobs:
  build-and-test:
    name: Build Pipeline & Parity Checks
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & Pybind11
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pybind11

      - name: Syntax & Compilation Check (Gaze Intent)
        run: |
          python -m py_compile ai_pipeline/gaze_intent/gaze_intent.py

      - name: Set up vcpkg Caching
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg Installed Packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
            ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2-
            ${{ runner.os }}-vcpkg-

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Configure CMake
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          cmake -B build `
            -G "Ninja" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DPython3_EXECUTABLE="$pythonPath" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Core Engine & DSP Filter
        run: cmake --build build --config Release --parallel

      - name: Fix tl2cgen Windows DLL Path Issue
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $libBinPath = Join-Path $pythonDir "Library\bin"
          New-Item -ItemType Directory -Force -Path $libBinPath

      - name: Execute CTest (Unit, Parity & E2E Tests)
        working-directory: build
        run: ctest -C Release --output-on-failure