name: HandEye Tracker CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # =========================================================================
  # 1. PYTHON VALIDATION & LINT
  # =========================================================================
  python-pipeline:
    name: Python Pipeline & AI Model Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # Upgraded to fix Node 20 deprecation

      - name: Set up Python 3.11
        uses: actions/setup-python@v6 # Upgraded to fix Node 20 deprecation
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pybind11

      - name: Syntax & Compilation Check (Gaze Intent)
        run: |
          python -m py_compile ai_pipeline/gaze_intent/gaze_intent.py

  # =========================================================================
  # 2. C++ ENGINE & DSP FILTER BUILD
  # =========================================================================
  cpp-core-engine:
    name: C++ Core Engine & vcpkg Build
    runs-on: windows-latest
    needs: python-pipeline

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # Upgraded
        with:
          submodules: recursive

      - name: Set up Python 3.11 (for Pybind11 Embed)
        uses: actions/setup-python@v6 # Upgraded
        with:
          python-version: "3.11"

      - name: Install Pybind11 into Python
        run: |
          python -m pip install --upgrade pip
          pip install pybind11

      - name: Set up vcpkg Caching
        uses: actions/github-script@v8 # Upgraded
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg Installed Packages
        uses: actions/cache@v5 # Upgraded
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
            ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure CMake
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DPython3_EXECUTABLE="$pythonPath" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Core Engine & DSP Filter
        run: cmake --build build --config Release --parallel

      - name: Execute CTest (DSP Filter Unit Tests)
        working-directory: build
        run: ctest -C Release --output-on-failure