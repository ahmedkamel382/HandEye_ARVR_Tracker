name: HandEye Tracker CI/CD Pipeline

on:
  push:
    branches: [ "master", "first-full-working-demo" ]
  pull_request:
    branches: [ "master", "first-full-working-demo" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-fast-checks:
    name: Python Suites & Asset Checks
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & Pybind11
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pybind11

      - name: Fix tl2cgen Windows DLL Path Issue
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $libBinPath = Join-Path $pythonDir "Library\bin"
          New-Item -ItemType Directory -Force -Path $libBinPath | Out-Null

      - name: Bytecode Compilation Check (All Python Modules)
        run: |
          python -m compileall -q ai_pipeline core_engine/tests core_engine/tools core_engine/os_integration/tester dsp_filter/evaluation

      - name: Verify Required Model Assets & Non-Zero Sizes
        shell: pwsh
        run: |
          $required = @(
            "assets/face_landmarker.task",
            "assets/hand_landmarker.task",
            "assets/hand_gesture_rf.pkl",
            "ai_pipeline/gaze_intent/models/gesture_model.dll",
            "ai_pipeline/gaze_intent/models/gaze_pitch.dll",
            "ai_pipeline/gaze_intent/models/gaze_yaw.dll",
            "core_engine/generated/hand_forest/parity_cases.csv"
          )
          foreach ($p in $required) {
            if (-not (Test-Path -LiteralPath $p) -or (Get-Item -LiteralPath $p).Length -le 0) {
              throw "Missing or empty required model/asset file: $p"
            }
          }
          Write-Host "All required model assets verified."

      - name: Hand Kinematics Index Tracker Unit Tests
        run: |
          python ai_pipeline/hand_kinematics/tests/check_index_tracker.py

      - name: Hand Tracker Logic Unit Tests
        run: |
          python ai_pipeline/hand_kinematics/tests/check_tracker_logic.py

      - name: Hand Tracking Observability Unit Tests
        run: |
          python ai_pipeline/hand_kinematics/tests/check_tracking_observability.py

      - name: Gaze Intent Unit Tests
        run: |
          python -m pytest ai_pipeline/gaze_intent/tests -v

      - name: DSP Evaluation Unit Tests (138 Tests)
        shell: pwsh
        run: |
          $baseTemp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $resolvedTemp = (Resolve-Path -LiteralPath $baseTemp).Path
          $env:TEMP = $resolvedTemp
          $env:TMP = $resolvedTemp
          python -m unittest discover -s dsp_filter/evaluation -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "DSP evaluation unit tests failed with exit code $LASTEXITCODE" }

  cpp-engine-and-e2e:
    name: C++ Engine, Parity & E2E Pipeline
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & Pybind11
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pybind11

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Prepare tl2cgen Path, Overlay Triplet & vcpkg ABI Cache Key
        id: vcpkg-env
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $libBinPath = Join-Path $pythonDir "Library\bin"
          New-Item -ItemType Directory -Force -Path $libBinPath | Out-Null

          $vcpkgCache = Join-Path $env:RUNNER_TEMP "vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $vcpkgCache | Out-Null

          $tripletDir = Join-Path $env:RUNNER_TEMP "vcpkg-triplets"
          New-Item -ItemType Directory -Force -Path $tripletDir | Out-Null
          $tripletFile = Join-Path $tripletDir "x64-windows.cmake"
          @(
            "set(VCPKG_TARGET_ARCHITECTURE x64)"
            "set(VCPKG_CRT_LINKAGE dynamic)"
            "set(VCPKG_LIBRARY_LINKAGE dynamic)"
            "set(VCPKG_BUILD_TYPE release)"
          ) | Set-Content -Path $tripletFile -Encoding utf8

          $tripletHash = (Get-FileHash -LiteralPath $tripletFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $clCmd = Get-Command cl.exe -ErrorAction Stop
          $clHash = (Get-FileHash -LiteralPath $clCmd.Source -Algorithm SHA256).Hash.ToLowerInvariant()

          $vcpkgRev = "unknown"
          if ($env:VCPKG_INSTALLATION_ROOT) {
            if (Test-Path -LiteralPath (Join-Path $env:VCPKG_INSTALLATION_ROOT ".git")) {
              $gitRev = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD 2>$null
              if ($LASTEXITCODE -eq 0 -and $gitRev) {
                $vcpkgRev = $gitRev.Trim()
              }
            }
            if ($vcpkgRev -eq "unknown") {
              $vcpkgExe = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
              if (Test-Path -LiteralPath $vcpkgExe) {
                $verLine = (& $vcpkgExe version 2>$null | Select-Object -First 1)
                if ($verLine) { $vcpkgRev = $verLine.Trim() }
              }
            }
          }

          $imageOs = if ($env:ImageOS) { $env:ImageOS } else { "windows" }
          $imageVer = if ($env:ImageVersion) { $env:ImageVersion } else { "local" }
          $vscmdVer = if ($env:VSCMD_VER) { $env:VSCMD_VER } else { "unknown" }
          $vcToolsVer = if ($env:VCToolsVersion) { $env:VCToolsVersion } else { "unknown" }
          $winSdkVer = if ($env:WindowsSDKVersion) { $env:WindowsSDKVersion.TrimEnd('\') } else { "unknown" }

          $fingerprint = @(
            "image_os=$imageOs"
            "image_ver=$imageVer"
            "vscmd_ver=$vscmdVer"
            "vctools_ver=$vcToolsVer"
            "winsdk_ver=$winSdkVer"
            "cl_sha256=$clHash"
            "vcpkg_rev=$vcpkgRev"
            "triplet_sha256=$tripletHash"
          ) -join "`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $shaBytes = $sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($fingerprint))
          } finally {
            $sha256.Dispose()
          }
          $envHash = ([System.BitConverter]::ToString($shaBytes) -replace '-', '').ToLowerInvariant().Substring(0, 16)

          Write-Host "vcpkg ABI fingerprint inputs:"
          Write-Host $fingerprint
          Write-Host "Computed vcpkg env_hash: $envHash"

          "VCPKG_DEFAULT_BINARY_CACHE=$vcpkgCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_BINARY_SOURCES=clear;files,$vcpkgCache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_OVERLAY_TRIPLETS_DIR=$tripletDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOCALAPPDATA_PATH=$env:LOCALAPPDATA" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "env_hash=$envHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image_ver=$imageVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg Binary Archives
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: ${{ runner.os }}-vcpkg-rel-v2-${{ steps.vcpkg-env.outputs.env_hash }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-rel-v2-${{ steps.vcpkg-env.outputs.env_hash }}-

      - name: Configure CMake & Install vcpkg Dependencies (with Retry)
        id: cmake-configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $preCount = (Get-ChildItem -LiteralPath $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File -Filter "*.zip" -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "vcpkg binary cache dir: $env:VCPKG_DEFAULT_BINARY_CACHE (pre-existing .zip archives: $preCount)"
          Write-Host "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES"

          $pythonPath = (Get-Command python).Source
          $ninjaPath = (Get-Command ninja).Source
          $configured = $false
          try {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "CMake configure attempt $attempt of 3..."
              cmake -B build `
                -G "Ninja" `
                -DCMAKE_MAKE_PROGRAM="$ninjaPath" `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
                -DVCPKG_TARGET_TRIPLET="x64-windows" `
                -DVCPKG_OVERLAY_TRIPLETS="$env:VCPKG_OVERLAY_TRIPLETS_DIR" `
                -DPython3_EXECUTABLE="$pythonPath" `
                -DCMAKE_BUILD_TYPE=Release `
                -DDSP_BUILD_BENCHMARKS=ON `
                -DOSI_BUILD_BENCHMARKS=ON
              if ($LASTEXITCODE -eq 0) {
                $configured = $true
                break
              }
              if ($attempt -lt 3) {
                Write-Warning "CMake configure attempt $attempt failed (exit $LASTEXITCODE); retrying in 15s..."
                Start-Sleep -Seconds 15
              }
            }
          } finally {
            $postCount = (Get-ChildItem -LiteralPath $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File -Filter "*.zip" -ErrorAction SilentlyContinue | Measure-Object).Count
            $newBuilt = if ($postCount -gt $preCount) { "true" } else { "false" }
            Write-Host "vcpkg binary cache post-configure .zip archives: $postCount (new_archives_built=$newBuilt)"
            "pre_archives=$preCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "post_archives=$postCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "new_archives_built=$newBuilt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          if (-not $configured) { throw "CMake configure failed after 3 attempts" }

      - name: Save vcpkg Binary Archives (Complete)
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true' && steps.cmake-configure.outputs.post_archives != '0'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: ${{ runner.os }}-vcpkg-rel-v2-${{ steps.vcpkg-env.outputs.env_hash }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Save Partial vcpkg Binary Archives on Failure
        if: failure() && steps.vcpkg-cache.outputs.cache-hit != 'true' && steps.cmake-configure.outputs.new_archives_built == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: ${{ runner.os }}-vcpkg-rel-v2-${{ steps.vcpkg-env.outputs.env_hash }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Core Engine, Tests & Benchmarks
        run: cmake --build build --parallel

      - name: Run Hand Forest Self-Test (6000 Golden Parity Cases)
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $env:PATH = "$PWD\build;$PWD\build\vcpkg_installed\x64-windows\bin;$pythonDir;$env:PATH"
          .\build\core_engine.exe --selftest-hand-forest core_engine/generated/hand_forest/parity_cases.csv
          if ($LASTEXITCODE -ne 0) { throw "Hand forest self-test failed with exit code $LASTEXITCODE" }

      - name: Run Real Production AI Bridge & MediaPipe Landmarker Preflight (--check)
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $env:PATH = "$PWD\build;$PWD\build\vcpkg_installed\x64-windows\bin;$pythonDir;$env:PATH"
          $tmpAvi = Join-Path $env:RUNNER_TEMP "ci_preflight_check.avi"
          if (-not $env:RUNNER_TEMP) { $tmpAvi = Join-Path $env:TEMP "ci_preflight_check.avi" }
          python -c "import cv2, numpy as np, sys; vw = cv2.VideoWriter(sys.argv[1], cv2.VideoWriter_fourcc(*'MJPG'), 60, (640, 480)); f = np.zeros((480, 640, 3), dtype=np.uint8); vw.write(f); vw.write(f); vw.release()" $tmpAvi
          try {
            .\build\core_engine.exe --check --ai-root "$PWD\ai_pipeline" --gaze-models "$PWD\ai_pipeline\gaze_intent\models" --video $tmpAvi
            if ($LASTEXITCODE -ne 0) { throw "core_engine --check failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -Force $tmpAvi -ErrorAction SilentlyContinue
          }

      - name: Execute CTest Suite (8/8 Unit, C API, Parity & E2E Tests)
        working-directory: build
        run: ctest --output-on-failure --timeout 180

      - name: Execute HandEye Tester Unit Tests (12 Tests)
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "$PWD\build" -Recurse -Filter "os_integration_capi.dll" | Select-Object -First 1
          if (-not $dll) { throw "os_integration_capi.dll not found under build/" }
          $env:OSI_CAPI_DLL = $dll.FullName
          python -m pytest core_engine/os_integration/tester/tests -v
          if ($LASTEXITCODE -ne 0) { throw "HandEye Tester pytest suite failed with exit code $LASTEXITCODE" }

      - name: Execute DSP Recorder E2E Integration Check
        shell: pwsh
        run: |
          $baseTemp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $resolvedTemp = (Resolve-Path -LiteralPath $baseTemp).Path
          $env:TEMP = $resolvedTemp
          $env:TMP = $resolvedTemp
          $pythonDir = Split-Path (Get-Command python).Source
          $env:PATH = "$PWD\build;$PWD\build\vcpkg_installed\x64-windows\bin;$pythonDir;$env:PATH"
          python dsp_filter/evaluation/check_recorder_pipeline.py --exe build/core_engine.exe
          if ($LASTEXITCODE -ne 0) { throw "check_recorder_pipeline.py failed with exit code $LASTEXITCODE" }

      - name: Upload CTest & Tray Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/LastTest.log
            build/vcpkg-manifest-install.log
            ${{ env.LOCALAPPDATA_PATH }}/HandEyeTracker/handeye_tray.log